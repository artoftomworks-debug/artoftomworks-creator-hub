function renderResultLocations(run){
 const files=[];for(const job of run?.jobs||[])for(const result of job.results||[]){const folder=String(result.subfolder||'').replaceAll('\\','/'),sourceRun=folder.match(/(?:^|\/)ArtofTomworks\/SceneDNA\/([a-f0-9]{32})(?:\/|$)/)?.[1];files.push({shotId:job.shotId,number:job.number,title:job.title,path:[folder,result.filename].filter(Boolean).join('/'),folder,reused:!!sourceRun&&sourceRun!==run.id});}

function imageOrientation(width,height){if(!Number.isFinite(width)||!Number.isFinite(height)||width<=0||height<=0)throw Error('Invalid image dimensions.');return width/height>1.05?'landscape':height/width>1.05?'portrait':'square';}
function followRenderOrientation(width,height,imageWidth,imageHeight){
 const target=imageOrientation(width,height),source=imageOrientation(imageWidth,imageHeight);
 if(target===source)return {width,height};
 if(source==='square')return {width:Math.min(width,height),height:Math.min(width,height)};
 if(target!=='square')return {width:height,height:width};
 const long=Math.max(width,height),short=Math.max(256,Math.round(long/(Math.max(imageWidth,imageHeight)/Math.min(imageWidth,imageHeight))/32)*32);

}
// Comfy errors also contain complete tensor inputs. Keep the cause and trace,

function renderExecutionError(messages){
 const events=Array.isArray(messages)?messages:[];
 const event=events.find(v=>Array.isArray(v)&&v[0]==='execution_error')||events.find(v=>Array.isArray(v)&&v[0]==='execution_interrupted');
 const raw=event?.[1];
 if(!raw||typeof raw!=='object')return {message:'ComfyUI execution failed. No detailed error was returned.',nodeId:'',nodeType:'',traceback:'',memory:false};
 const clean=(v,n)=>typeof v==='string'?v.replace(/\u001b\[[0-9;]*m/g,'').slice(0,n):'';

 const traceback=Array.isArray(raw.traceback)?raw.traceback.filter(v=>typeof v==='string').map(v=>clean(v,2000)).join('\n').slice(0,14000):clean(raw.traceback,14000);

function extraLabels(lang){const result=Object.fromEntries(X_KEYS.map((k,i)=>[k,(X_VALUES[lang]||X_VALUES.EN).split('|')[i]]));result.languageHint=({EN:'The recipe remains in your own words. Choose the output language next to each prompt and request a local translation when needed.',HU:'A recept a saját nyelveden megmarad. A kész prompt mellett válassz nyelvet, és szükség esetén kérj helyi fordítást.',DE:'Das Rezept bleibt unverändert. Die Sprache direkt am Prompt wählen und bei Bedarf lokal übersetzen.',FR:'La recette reste inchangée. Choisissez la langue près du prompt et demandez une traduction locale.',ES:'La receta se conserva. Elige el idioma junto al prompt y solicita traducción local.',IT:'La ricetta resta invariata. Scegli la lingua accanto al prompt e richiedi la traduzione locale.',PT:'A receita é preservada. Escolha o idioma junto ao prompt e peça tradução local.',PL:'Opis pozostaje niezmieniony. Wybierz język przy prompcie i poproś o lokalne tłumaczenie.'}[lang]||result.translationHint);return result;}
function validateExtraLabels(){return Object.values(X_VALUES).every(s=>s.split('|').length===X_KEYS.length);}
